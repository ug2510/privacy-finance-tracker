# ============================================================
#  Privacy Finance Tracker – Backend Configuration
# ============================================================

# --- Server ---
server.port=8080

# --- SQLite (zero-install, file lives next to the JAR) ---
spring.datasource.url=jdbc:sqlite:./data/finance_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Spring AI: Google Gemini ---
# Set GEMINI_API_KEY in your environment (Windows: setx GEMINI_API_KEY "your-key")
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.chat.options.temperature=0.2

# --- Actuator (health/info endpoints) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- CORS: allow the React Native local dev server and any local IP ---
# (Override per-profile if needed)
# cors.allowed-origins=http://localhost:8081,http://localhost:19006

# --- Logging ---
logging.level.com.privacyfinance=DEBUG
logging.level.org.springframework.ai=INFO

# --- Server ---
server.port=8080
server.address=0.0.0.0